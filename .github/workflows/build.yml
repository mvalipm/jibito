name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # کلید انتشار در Secrets تعریف شده؟ (راهنما: RELEASE.md)
      HAS_RELEASE_KEY: ${{ secrets.JIBITO_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests and build debug APK
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      # نسخه‌ی انتشار (R8) همیشه ساخته می‌شود تا خرابی‌اش همان موقع معلوم شود؛ امضا فقط اگر کلید در Secrets باشد
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.JIBITO_KEYSTORE_BASE64 }}
          JIBITO_KEYSTORE_PASSWORD: ${{ secrets.JIBITO_KEYSTORE_PASSWORD }}
          JIBITO_KEY_ALIAS: ${{ secrets.JIBITO_KEY_ALIAS }}
          JIBITO_KEY_PASSWORD: ${{ secrets.JIBITO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export JIBITO_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          gradle assembleRelease --stacktrace 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/release.jks"

      # اگر ساخت شکست خورد، خطاهای کامپایل و تست‌های ردشده را به‌صورت خلاصه بالای صفحه‌ی گیت‌هاب نشان می‌دهد
      - name: Show errors summary
        if: failure()
        run: |
          grep -E "^e: " build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in tc.findall('failure'):
                  msg = (fl.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error::TEST FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jibito-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jibito-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      # فایل ساختار دیتابیس (app/schemas) را اگر عوض شده باشد خودکار در گیت ذخیره می‌کند
      - name: Save Room schema to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Schema unchanged"
          else
            git commit -m "Update Room schema [skip ci]"
            git push
          fi
