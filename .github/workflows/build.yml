name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "تصویرهای مرجع اسکرین‌شات از نو ساخته و در همین شاخه ذخیره شوند (بعد از تغییر عمدی ظاهر)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # کلید انتشار در Secrets تعریف شده؟ (راهنما: RELEASE.md)
      HAS_RELEASE_KEY: ${{ secrets.JIBITO_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # نسخه‌ی Gradle از gradle/wrapper/gradle-wrapper.properties می‌آید (همان نسخه روی هر کامپیوتر)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # هیچ فایل کاتلین بالای ۵۰۰ خط نباشد (بدهی فنی: فایل‌های بزرگ دوباره جمع نشوند)
      - name: Check Kotlin file sizes
        run: |
          big=$(find app/src -name '*.kt' -exec awk 'END { if (NR > 500) print NR, FILENAME }' {} \;)
          if [ -n "$big" ]; then
            echo "$big" | while read -r n f; do echo "::error file=$f::$n lines (limit 500). Split this file."; done
            exit 1
          fi
          echo "All Kotlin files are at most 500 lines"

      # تست‌ها + اسکرین‌شات‌ها (Roborazzi) + APK آزمایشی.
      # اسکرین‌شات‌ها با تصویرهای مرجع app/src/test/screenshots مقایسه می‌شوند و هر تغییر ظاهری ساخت را می‌شکند.
      # مرجع‌ها از نو ساخته می‌شوند اگر هنوز نیستند، یا با اجرای دستی و record_screenshots.
      - name: Run tests and build debug APK
        run: |
          set -o pipefail
          if [ "${{ inputs.record_screenshots }}" = "true" ] || [ -z "$(ls -A app/src/test/screenshots 2>/dev/null)" ]; then
            echo "SCREENSHOT_MODE=record" >> "$GITHUB_ENV"
            MODE="-Proborazzi.test.record=true"
          else
            MODE="-Proborazzi.test.verify=true"
          fi
          ./gradlew testDebugUnitTest assembleDebug $MODE --stacktrace 2>&1 | tee build.log

      # مرجع‌ها + (اگر مقایسه شکست خورد) تصویر تفاوت‌ها
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: |
            app/src/test/screenshots/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

      # مرجع‌های تازه در همین شاخه ذخیره می‌شوند (در PR ممکن نیست؛ آن‌جا فقط مقایسه)
      - name: Save recorded screenshots to branch
        if: env.SCREENSHOT_MODE == 'record' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update screenshot references [skip ci]"
            # اگر در این فاصله کامیت تازه‌ای به شاخه رسیده، اول روی آن قرار می‌گیرد
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Android Lint: هر خطای لینت ساخت را متوقف می‌کند (baseline نداریم؛ مشکل‌ها همان‌جا درست می‌شوند).
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a build.log

      # گزارش متنی لینت (همه‌ی هشدارها) در لاگ و خلاصه‌ی اجرای CI؛ حتی اگر لینت شکست بخورد
      - name: Show lint report
        if: always()
        run: |
          report=$(find app/build -name 'lint-results-debug.txt' -print -quit 2>/dev/null)
          if [ -n "$report" ]; then
            cat "$report"
            { echo '### Lint'; echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Lint text report not found"; find app/build -name 'lint-results*' || true
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/**/lint-results-debug.txt
          if-no-files-found: ignore

      # نسخه‌ی انتشار (R8) همیشه ساخته می‌شود تا خرابی‌اش همان موقع معلوم شود؛ امضا فقط اگر کلید در Secrets باشد
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.JIBITO_KEYSTORE_BASE64 }}
          JIBITO_KEYSTORE_PASSWORD: ${{ secrets.JIBITO_KEYSTORE_PASSWORD }}
          JIBITO_KEY_ALIAS: ${{ secrets.JIBITO_KEY_ALIAS }}
          JIBITO_KEY_PASSWORD: ${{ secrets.JIBITO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export JIBITO_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build.log
          rm -f "$RUNNER_TEMP/release.jks"

      # صفحه‌ی اجازه‌ی پیامک قول می‌دهد «جیبیتو اصلاً اجازه‌ی اینترنت نداره»؛ اگر کتابخانه‌ای بی‌صدا INTERNET اضافه کند، این قول دروغ می‌شود.
      # پس فهرست مجوزهای همان APK نهایی (بعد از ادغام manifest کتابخانه‌ها) چک می‌شود
      - name: Check app has no internet permission
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::APK نهایی اجازه‌ی INTERNET دارد، ولی صفحه‌ی اجازه‌ی پیامک می‌گوید ندارد. کتابخانه‌ای که اضافه‌اش کرده را پیدا کن (یا متن perm_promise_no_internet را عوض کن)."
            exit 1
          fi

      # اگر ساخت شکست خورد، خطاهای کامپایل و تست‌های ردشده را به‌صورت خلاصه بالای صفحه‌ی گیت‌هاب نشان می‌دهد
      - name: Show errors summary
        if: failure()
        run: |
          grep -E "^e: " build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in tc.findall('failure'):
                  msg = (fl.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error::TEST FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          done

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: jibito-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: jibito-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      # فایل ساختار دیتابیس (app/schemas) را اگر عوض شده باشد خودکار در گیت ذخیره می‌کند
      - name: Save Room schema to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Schema unchanged"
          else
            git commit -m "Update Room schema [skip ci]"
            # اگر در این فاصله کامیت تازه‌ای به main رسیده (مثلاً دو PR پشت سر هم مرج شده)، اول روی آن قرار می‌گیرد
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # تست‌های روی امولاتور (app/src/androidTest) برای مسیرهای حیاتی: رسیدن پیامک، دکمه‌های نوتیفیکیشن، بازگردانی پشتیبان.
  # هر تست با Orchestrator در فرایند جدا و با داده‌ی پاک اجرا می‌شود.
  # روی دو نسخه: اندروید ۱۴ (رایج) و اندروید ۱۶ (همان targetSdk اپ، تا رفتارهای تازه‌ی آن هم آزموده شوند)
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # جای خالی دیسک ماشین GitHub برای امولاتور کم شده بود (۶٫۷ گیگ داشت، ۷٫۴ گیگ لازم بود و امولاتور بالا نمی‌آمد)؛
      # ابزارهای از پیش نصب‌شده‌ای که این پروژه لازم ندارد پاک می‌شوند
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules
          df -h /

      # شتاب سخت‌افزاری امولاتور روی ماشین لینوکس GitHub
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # اول ساخت (بیرون از امولاتور، تا خطای کامپایل زود و جدا دیده شود)
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # پیش از تست‌ها یک پیامک بانک ملی در صندوق امولاتور گذاشته می‌شود (SmsReceiveTest آن را می‌خواند).
      # \n در متن را کنسول امولاتور به خط تازه تبدیل می‌کند.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # دیسک امولاتور کوچک‌تر از پیش‌فرض (۶ گیگ)؛ اپ و تست‌ها خیلی کمتر لازم دارند
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb emu sms send 20004000 "بانک ملی ایران\nبرداشت\nمبلغ:1,357,000\nمانده:9,000,000\nحساب:0101XXXX"
            sleep 5
            ./gradlew connectedDebugAndroidTest --stacktrace

      # شمار تست‌ها در لاگ و خلاصه‌ی اجرا؛ اگر هیچ تستی اجرا نشده باشد، شکست (سبزِ بی‌تست قبول نیست)
      - name: Instrumented test summary
        if: always()
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          rows, total, bad = [], 0, 0
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  total += 1
                  status = 'FAILED' if tc.find('failure') is not None or tc.find('error') is not None else ('SKIPPED' if tc.find('skipped') is not None else 'passed')
                  bad += status != 'passed'
                  rows.append(f"| {tc.get('classname', '').split('.')[-1]} | {tc.get('name')} | {status} |")
          out = [f"### Instrumented tests (API {os.environ['API_LEVEL']})", f'{total} tests, {bad} not passed', '', '| class | test | result |', '|---|---|---|'] + sorted(rows)
          print('\n'.join(out))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('\n'.join(out) + '\n')
          if total == 0:
              raise SystemExit('::error::No instrumented test results found')
          PY

      # نام فایل نتیجه فاصله دارد (TEST-test(AVD) - 14-…xml)، پس فایل‌ها با glob خود پایتون پیدا می‌شوند نه با for در شل
      - name: Show failed instrumented tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in tc.findall('failure') + tc.findall('error'):
                      msg = (fl.get('message') or fl.text or '').replace('\n', ' ')[:300]
                      print(f"::error::INSTRUMENTED TEST FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
